<div id="pageHost"></div><div hidden="True" id="pageCache"><template data-page-id="home"><section class="page" id="home"><div class="grid"><div class="card s12 overview-security-alert" id="overviewSecurityAlert" style="display:none"><div id="overviewSecurityAlertContent"></div></div><div class="card s12 security-overview-card"><div class="settings-heading"><div><h2>Security</h2><div class="muted">Security mode, locks and motion sensors.</div></div></div><div id="overviewSecuritySummary" class="overview-summary"></div></div><div class="card s12" id="overviewLightingCard"><div class="settings-heading"><div><h2>Lighting</h2><div class="muted">Active lighting by room.</div></div></div><div id="overviewLightingSummary" class="overview-summary"></div></div><div class="card s12" id="overviewAvCard"><div class="settings-heading"><div><h2>Audio &amp; Video</h2><div class="muted">Active AV devices by room.</div></div></div><div id="overviewAvSummary" class="overview-summary"></div></div><div class="card s12" id="overviewErrorsCard" style="display:none"><div class="settings-heading"><div><h2>Errors</h2><div class="muted">Connections that need attention.</div></div></div><div id="overviewErrors"></div></div></div></section></template><template data-page-id="lighting"><section class="page" id="lighting"><div class="lighting-root" id="lightingRoot"><div class="lighting-filter"><select aria-label="Room" id="lightingRoomFilter" onchange="setLightingRoom(this.value)"></select><span class="muted" id="roomCount"></span></div><div class="devices" id="lightingSliders"></div></div></section></template><template data-page-id="shading"><section class="page" id="shading"><div class="card"><div class="settings-heading"><div><h2>Curtains &amp; Screens</h2><div class="muted">Configured curtains and screens, grouped by room.</div></div><span class="badge" id="shadingDeviceStatus">0 devices</span></div><div id="shadingDeviceList" class="devices"></div></div></section></template><template data-page-id="av"><section class="page" id="av"><div class="card"><div class="settings-heading"><div><h2>Audio &amp; Video</h2><div class="muted">Configured AV devices, grouped by room.</div></div><span class="badge" id="avDeviceStatus">0 devices</span></div><div class="lighting-filter"><select id="avRoomFilter" aria-label="Room" onchange="setAvRoomFilter(this.value)"></select><span class="muted" id="avRoomCount"></span></div><div id="avDeviceList" class="devices"></div></div></section></template><template data-page-id="cameras"><section class="page" id="cameras"><div class="card camera-card"><div class="settings-heading"><div><h2>Cameras</h2><div class="muted">Cameras configured in Devices are shown here.</div></div><span class="badge" id="cameraStatus">0 cameras</span></div><div id="cameraDeviceGrid" class="camera-grid"></div></div></section></template><template data-page-id="climate"><section class="page" id="climate"><div class="climate-card"><div class="climate-head"><div class="climate-title-row"><button class="climate-back" aria-label="Back" onclick="page('home')">←</button><div><div class="climate-room">Thermostat</div><h2 style="margin:4px 0 0">Living Room</h2></div></div><div class="climate-readings"><div class="climate-reading"><span class="reading-icon">🌡️</span><span id="climateOutdoor">25 °C</span></div><div class="climate-reading"><span class="reading-icon">☁</span><span id="climateAmbient">21.5 °C</span></div></div></div><div class="climate-dial-wrap"><div class="climate-dial"><div class="climate-dial-content"><div class="climate-current-label">Target</div><div class="climate-temp-main"><span id="climateTargetBig">21.0</span><small>°C</small></div><div class="climate-mode-indicator" id="climateModeIndicator">❄ Cooling</div><div class="climate-target">Current room temperature <span id="climateCurrentSmall">21.5 °C</span></div></div></div></div><div class="climate-adjust"><button class="minus" onclick="adjustClimate(-0.5)" aria-label="Decrease target temperature">−</button><div></div><button class="plus" onclick="adjustClimate(0.5)" aria-label="Increase target temperature">+</button></div><div class="climate-actions"><div class="climate-control"><button id="climatePower" class="active" onclick="toggleClimatePower()"><span class="control-icon">⏻</span><span id="climatePowerText">On</span><span class="control-sub" id="climatePowerSub">System active</span></button></div><div class="climate-control"><button id="climateModeButton" onclick="toggleClimateModeMenu()"><span class="control-icon" id="climateModeIcon">❄️</span><span id="climateModeText">Cooling</span><span class="control-sub">Heat / Cool</span></button><div class="climate-menu" id="climateModeMenu"><button onclick="setClimateMode('heat')">🔥 Heating <span>Heat</span></button><button onclick="setClimateMode('cool')">❄️ Cooling <span>Cool</span></button></div></div><div class="climate-control"><button id="climateFanButton" onclick="toggleClimateFanMenu()"><span class="control-icon">🌀</span><span id="climateFanText">50%</span><span class="control-sub">Ventilation</span></button><div class="climate-menu" id="climateFanMenu"><button onclick="setClimateFan(25)">25%</button><button onclick="setClimateFan(50)">50%</button><button onclick="setClimateFan(75)">75%</button><button onclick="setClimateFan(100)">100%</button></div></div></div><div class="climate-status"><span>System status:</span><span class="state" id="climateState">Cooling · Fan 50%</span></div></div></section></template><template data-page-id="security"><section class="page" id="security">

<script>
let socket=null, timer=null;
let settingsAccessToken='',settingsHeartbeatTimer=null,settingsUnlockPromise=null,settingsUnlockResolve=null;
const meta={home:['Overview',''],lighting:['Lighting',''],shading:['Curtains & Screens','Curtains and sun protection'],av:['Audio & Video','Entertainment'],climate:['Climate','Temperature and ventilation'],rooms:['Rooms','Room control'],scenes:['Scenes','Favorites and automation'],energy:['Energy','Consumption and production'],security:['Security','Electric locks and motion sensors'],settings:['Settings','KNX/IP connection and group addresses']};
function resetLightingPage(){
  const page=document.getElementById('lighting');
  if(!page)return;
  page.innerHTML='<div id="lightingRoot" class="lighting-root">'+
    '<div class="lighting-filter">'+
    '<select id="lightingRoomFilter" onchange="setLightingRoom(this.value)" aria-label="Room"></select>'+
    '<span id="roomCount" class="muted"></span>'+
    '</div>'+
    '<div id="lightingSliders" class="devices"></div>'+
    '</div>';
}
let pageTemplates = {};
let currentPageId = null;
function initPageTemplates(){
  const host=document.getElementById('pageHost');
  const cache=document.getElementById('pageCache');
  if(!host||!cache)return;
  pageTemplates={};
  cache.querySelectorAll('template[data-page-id]').forEach(t=>{
    const id=t.dataset.pageId;
    const sec=t.content.firstElementChild;
    if(id&&sec) pageTemplates[id]=sec.outerHTML;
  });
  host.replaceChildren();
}
function showPage(id,b){
  const host=document.getElementById('pageHost');
  const markup=pageTemplates[id];
  if(!host||!markup)return;
  currentPageId=id;
  const tpl=document.createElement('template');
  tpl.innerHTML=markup.trim();
  const target=tpl.content.firstElementChild;
  if(!target)return;
  target.hidden=false;
  target.classList.add('active');
  host.replaceChildren(target);
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  if(b)b.classList.add('active');
  const title=document.getElementById('title');
  const sub=document.getElementById('sub');
  if(title){title.textContent='';requestAnimationFrame(()=>{title.textContent=meta[id][0];});}
  if(sub){sub.textContent='';requestAnimationFrame(()=>{sub.textContent=meta[id][1];});}
  if(id==='settings'){renderRoomConfigs();renderDeviceConfigs();renderCommunicationLog();loadGithubSettings();}
  if(id==='rooms')renderConfiguredRooms();
  if(id==='cameras')renderConfiguredCameras();
  if(id==='shading')renderConfiguredShading();
  if(id==='av'){renderConfiguredAv();fetchAvStatuses();}
  if(id==='scenes')renderConfiguredScenes();
  if(id==='lighting'){resetLightingPage();renderLightingSliders();}
  if(id==='climate'){renderClimate();}
  if(id==='cameras'){closeCameraFullscreen();}
  if(id==='security'){renderSecurity();}
  if(id==='home'){renderOverview();}
}
function securityDevices(){try{const a=JSON.parse(localStorage.getItem('knxSecurityDevices')||'null');if(!Array.isArray(a))return [];return a.map((x,i)=>{if(x.type==='lock'||x.type==='motion'){return {...x,type:'security',securityType:x.type,enableWriteGa:x.enableWriteGa||'',enableFeedbackGa:x.enableFeedbackGa||''};}return {...x,type:'security',securityType:x.securityType==='motion'?'motion':'lock',enableWriteGa:x.enableWriteGa||'',enableFeedbackGa:x.enableFeedbackGa||''};});}catch(e){return []}}
function saveSecurityDevices(a,options={}){localStorage.setItem('knxSecurityDevices',JSON.stringify(a));if(options.shared!==false)syncSharedStateDebounced()}
function normalizeSecurityDevices(){
  const a=securityDevices().map((x,i)=>{
    const motion=(x.securityType==='motion'||x.type==='motion');
    return {
      id:x.id||('sec'+Date.now()+i),type:'security',securityType:motion?'motion':'lock',
      name:x.name||((motion?'Motion sensor ':'Electric lock ')+(i+1)),room:x.room||rooms()[0]||'',
      controllable:x.controllable!==false,
      writeGa:x.writeGa||'', feedbackGa:x.feedbackGa||'', physicalStatusGa:x.physicalStatusGa||x.statusGa||'',
      enableWriteGa:x.enableWriteGa||'', enableFeedbackGa:x.enableFeedbackGa||'', motionStatusGa:x.motionStatusGa||'',
      controlInvert:!!x.controlInvert, statusInvert:!!x.statusInvert, enableInvert:!!x.enableInvert, motionInvert:!!x.motionInvert,
      enabled:x.enabled!==false,locked:x.locked!==false,motion:!!x.motion,lastTime:x.lastTime||'—'
    };
  }); saveSecurityDevices(a);return a;
}
function renderSecurityConfigs(){ renderDeviceConfigs(); }

function addSecurityDevice(roomName){
  const a=securityDevices(),n=a.length+1,room=roomName||rooms()[0]||'';
  a.push({id:'sec'+Date.now(),type:'security',securityType:'lock',name:'Security device '+n,room,controllable:true,writeGa:'',feedbackGa:'',physicalStatusGa:'',enableWriteGa:'',enableFeedbackGa:'',motionStatusGa:'',controlInvert:false,statusInvert:false,enableInvert:false,motionInvert:false,enabled:true,locked:true,controlLocked:true,motion:false,lastTime:'—'});
  saveSecurityDevices(a);renderSecurityConfigs();renderSecurity();toast('Security device added to '+room);
}
function removeSecurityDevice(id){saveSecurityDevices(securityDevices().filter(x=>x.id!==id));renderSecurityConfigs();renderSecurity();toast('Security device removed')}
function motionIconSvg(state='motion'){return state==='standby'?'<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="12" r="5" fill="currentColor"/><path d="M17 22c2-3 5-4 7-4s5 1 7 4l4 9-5 2-3-6v8l5 8-4 2-4-6-4 6-4-2 5-8v-8l-3 6-5-2 4-9Z" fill="currentColor"/><path d="M9 15h5M34 15h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".55"/></svg>':'<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="26" cy="8" r="4" fill="currentColor"/><path d="M22 14c2-2 6-2 8 1l3 6 5 2-2 4-7-3-3-5-1 7 6 5-3 4-7-5-3 9-4-1 4-15 1-8-6 5-3-3 8-9Z" fill="currentColor"/><path d="M9 30c-2 2-3 4-3 7M14 33c-2 2-3 4-3 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".65"/></svg>'}
let securityView=localStorage.getItem('knxSecurityView')||'locks';
function setSecurityView(view){securityView=view;localStorage.setItem('knxSecurityView',view);renderSecurity();}
let securityLockIconId=0;
function securityLockIcon(locked){
 const id='security-lock-'+(++securityLockIconId),shackle='M20 35V23C20 6 46 6 46 23V35',turn=locked?'':'rotate(-35 20 35)';
 const layers=[36,40,44,48,52,56].map(y=>'<path d="M12 '+y+'H53" stroke="#756c32" stroke-opacity=".34" stroke-width="1"/><path d="M12 '+(y+1)+'H53" stroke="#fff4b2" stroke-opacity=".32" stroke-width=".7"/>').join('');
 return '<span class="security-lock-emoji '+(locked?'is-locked':'is-unlocked')+'" aria-hidden="true"><svg viewBox="0 0 64 64" data-lock-state="'+(locked?'locked':'unlocked')+'"><defs><linearGradient id="'+id+'-brass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d6ce80"/><stop offset=".16" stop-color="#e9df9a"/><stop offset=".52" stop-color="#bbb267"/><stop offset=".88" stop-color="#a79c51"/><stop offset="1" stop-color="#877b39"/></linearGradient><linearGradient id="'+id+'-steel" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#7f96aa"/><stop offset=".24" stop-color="#f4fafc"/><stop offset=".52" stop-color="#c3d1db"/><stop offset=".75" stop-color="#f1f6f9"/><stop offset="1" stop-color="#7a90a3"/></linearGradient></defs><ellipse cx="33" cy="60" rx="23" ry="2" fill="#000" opacity=".2"/><g transform="'+turn+'"><path d="'+shackle+'" fill="none" stroke="#566876" stroke-width="8" stroke-linecap="round"/><path d="'+shackle+'" fill="none" stroke="url(#'+id+'-steel)" stroke-width="5.7" stroke-linecap="round"/></g><path d="M11 31H53V59H11Z" fill="url(#'+id+'-brass)" stroke="#8b8144" stroke-width=".6"/><path d="M12 32H52" stroke="#f6edb2" stroke-width="1.3"/>'+layers+'<path d="M12 32V58" stroke="#fff5ba" stroke-opacity=".55" stroke-width="1.4"/><path d="M51 32V58" stroke="#746a30" stroke-opacity=".25" stroke-width="2"/><path d="M12 58H52" stroke="#70662c" stroke-opacity=".65" stroke-width="1"/></svg></span>';
}
function renderSecurity(){
 const locksBox=document.getElementById('securityLocks'), motionBox=document.getElementById('securityMotion'); if(!locksBox||!motionBox)return;
 const rs=rooms(), permittedRooms=new Set(rs);
 const raw=securityDevices(), devices=raw.filter(x=>permittedRooms.has(String(x.room||''))).map(x=>({...x,type:x.type==='security'?(x.securityType==='motion'?'motion':'lock'):x.type}));
 const roomsWith=(type)=>rs.filter(r=>devices.some(x=>x.room===r&&x.type===type));
 const dot=(red)=>'<span class="security-dot '+(red?'red':'')+'"></span>';
 function renderRoomCards(box,type){
   box.innerHTML=''; const uniqueRooms=roomsWith(type);
   if(!uniqueRooms.length){box.innerHTML='<div class="muted" style="padding:10px 0">No '+(type==='lock'?'locks':'motion sensors')+' configured.</div>';return;}
   uniqueRooms.forEach(room=>{
     const items=devices.filter(x=>x.type===type&&(x.room||'No room')===room);
     const card=document.createElement('div');card.className='security-page-room';
     let html='<div class="security-page-room-head"><span class="security-page-room-title">'+esc(room)+'</span><span class="security-page-room-count">'+items.length+' '+(type==='lock'?'lock':'sensor')+(items.length===1?'':'s')+'</span></div>';
     if(type==='lock'){
       html+=items.map(x=>{
         const i=raw.findIndex(z=>z.id===x.id), physical=x.locked!==false, control=x.controlLocked!==undefined?!!x.controlLocked:physical;
         const statusRed=x.statusInvert?!physical:physical?false:true;
         const lockLedRed=x.statusInvert?physical:!physical;
         const unlockLedRed=x.statusInvert?!physical:physical;
         const controlLockRed=x.controlInvert?!control:!control;
         const controlUnlockRed=x.controlInvert?control:!control;
         return '<div class="security-item"><div class="security-icon">'+securityLockIcon(physical)+'</div><div><div class="security-name">'+esc(x.name)+'</div><div class="security-state '+(physical?'locked':'unlocked')+'">'+dot(lockLedRed)+(physical?'Locked':'Unlocked')+'</div></div>'+(x.controllable?'<div class="security-actions"><button class="security-btn lock '+(control?'active':'')+(controlLockRed?' red-led':' green-led')+'" onclick="toggleSecurityLock('+i+',true)">Lock</button><button class="security-btn unlock '+(!control?'active':'')+(controlUnlockRed?' red-led':' green-led')+'" onclick="toggleSecurityLock('+i+',false)">Unlock</button></div>':'')+'</div>';
       }).join('');
     } else {

function updateUnifiedAddress(item,el){
 const key=el.dataset.addr;
 if(item.source==='lighting'){
   const a=sliders(),x=a.find(z=>z.id===item.sourceId);if(!x)return;
   const existingRgbw=x.rgbw||{};
   x.rgbw={write:Array.isArray(existingRgbw.write)?existingRgbw.write:['','','',''],feedback:Array.isArray(existingRgbw.feedback)?existingRgbw.feedback:['','','','']};
   if(key.startsWith('rgbw-')){
     const [kind,idx]=key.split('-').slice(1);
     if(el.value && !gaOK(el.value)){toast('Use for example 1/1/69');return;}
     const channel=kind==='w'?'write':'feedback';
     x.rgbw[channel][Number(idx)]=el.value.trim();
   } else x[key]=el.value.trim();
   saveSliders(a);
   refreshKNXFeedbackSubscriptions();
 } else if(item.source==='security'){
   const a=securityDevices(),x=a.find(z=>z.id===item.sourceId);if(!x)return;
   if(key==='securityType'){x.securityType=el.value==='motion'?'motion':'lock';x.type='security';saveSecurityDevices(a);renderDeviceConfigs();renderSecurity();return;}
   if(['controllable','motionInvert','enableInvert','statusInvert','controlInvert','colorInvert','knxInvert'].includes(key)) x[key]=el.value==='true';
   else x[key]=el.value.trim();
   saveSecurityDevices(a); if(key==='controllable')renderDeviceConfigs(); renderSecurity();renderOverview();if(key==='knxInvert')refreshKNXFeedbackSubscriptions();
 } else {const a=genericDevices(),x=a.find(z=>z.id===item.sourceId);if(!x)return;x[key]=el.value.trim();saveGenericDevices(a)}
