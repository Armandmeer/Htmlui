let pageTemplates = {};
let currentPageId = null;
function initPageTemplates(){
  const host=document.getElementById('pageHost');
  const cache=document.getElementById('pageCache');
  if(!host||!cache)return;
  pageTemplates={};
  cache.querySelectorAll('template[data-page-id]').forEach(t=>{
    const id=t.dataset.pageId;
    const sec=t.content.firstElementChild;
    if(id&&sec) pageTemplates[id]=sec.outerHTML;
  });
  host.replaceChildren();
}
function showPage(id,b){
  const host=document.getElementById('pageHost');
  const markup=pageTemplates[id];
  if(!host||!markup)return;
  currentPageId=id;
  const tpl=document.createElement('template');
  tpl.innerHTML=markup.trim();
  const target=tpl.content.firstElementChild;
  if(!target)return;
  target.hidden=false;
  target.classList.add('active');
  host.replaceChildren(target);
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  if(b)b.classList.add('active');
  const title=document.getElementById('title');
  const sub=document.getElementById('sub');
  if(title){title.textContent='';requestAnimationFrame(()=>{title.textContent=meta[id][0];});}
  if(sub){sub.textContent='';requestAnimationFrame(()=>{sub.textContent=meta[id][1];});}
  if(id==='settings'){renderRoomConfigs();renderDeviceConfigs();renderCommunicationLog();loadGithubSettings();loadPortalUsers();loadNuvexCloud();}
  if(id==='automation')renderAutomationRules();
  if(id==='cameras')renderConfiguredCameras();
  if(id==='shading')renderConfiguredShading();
  if(id==='av'){renderConfiguredAv();fetchAvStatuses();}
  if(id==='scenes')renderConfiguredScenes();
  if(id==='lighting'){resetLightingPage();renderLightingSliders();}
  if(id==='climate'){renderClimate();}
  if(id==='cameras'){closeCameraFullscreen();}
  if(id==='security'){renderSecurity();}
  if(id==='home'){renderOverview();}
}
function securityDevices(){try{const a=JSON.parse(localStorage.getItem('knxSecurityDevices')||'null');if(!Array.isArray(a))return [];return a.map((x,i)=>{if(x.type==='lock'||x.type==='motion'){return {...x,type:'security',securityType:x.type,enableWriteGa:x.enableWriteGa||'',enableFeedbackGa:x.enableFeedbackGa||''};}return {...x,type:'security',securityType:x.securityType==='motion'?'motion':'lock',enableWriteGa:x.enableWriteGa||'',enableFeedbackGa:x.enableFeedbackGa||''};});}catch(e){return []}}
function saveSecurityDevices(a,options={}){localStorage.setItem('knxSecurityDevices',JSON.stringify(a));if(options.shared!==false)syncSharedStateDebounced()}
function normalizeSecurityDevices(){
  const a=securityDevices().map((x,i)=>{
    const motion=(x.securityType==='motion'||x.type==='motion');
    return {
      id:x.id||('sec'+Date.now()+i),type:'security',securityType:motion?'motion':'lock',
      name:x.name||((motion?'Motion sensor ':'Electric lock ')+(i+1)),room:x.room||rooms()[0]||'',
      controllable:x.controllable!==false,
      writeGa:x.writeGa||'', feedbackGa:x.feedbackGa||'', physicalStatusGa:x.physicalStatusGa||x.statusGa||'',
      enableWriteGa:x.enableWriteGa||'', enableFeedbackGa:x.enableFeedbackGa||'', motionStatusGa:x.motionStatusGa||'',
      controlInvert:!!x.controlInvert, statusInvert:!!x.statusInvert, enableInvert:!!x.enableInvert, motionInvert:!!x.motionInvert,
      enabled:x.enabled!==false,locked:x.locked!==false,motion:!!x.motion,lastTime:x.lastTime||'—'
    };
  }); saveSecurityDevices(a);return a;
}
function renderSecurityConfigs(){ renderDeviceConfigs(); }

function addSecurityDevice(roomName){
  const a=securityDevices(),n=a.length+1,room=roomName||rooms()[0]||'';
  a.push({id:'sec'+Date.now(),type:'security',securityType:'lock',name:'Security device '+n,room,controllable:true,writeGa:'',feedbackGa:'',physicalStatusGa:'',enableWriteGa:'',enableFeedbackGa:'',motionStatusGa:'',controlInvert:false,statusInvert:false,enableInvert:false,motionInvert:false,enabled:true,locked:true,controlLocked:true,motion:false,lastTime:'—'});
  saveSecurityDevices(a);renderSecurityConfigs();renderSecurity();toast('Security device added to '+room);
}
function removeSecurityDevice(id){saveSecurityDevices(securityDevices().filter(x=>x.id!==id));renderSecurityConfigs();renderSecurity();toast('Security device removed')}
function motionIconSvg(state='motion'){return state==='standby'?'<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="12" r="5" fill="currentColor"/><path d="M17 22c2-3 5-4 7-4s5 1 7 4l4 9-5 2-3-6v8l5 8-4 2-4-6-4 6-4-2 5-8v-8l-3 6-5-2 4-9Z" fill="currentColor"/><path d="M9 15h5M34 15h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".55"/></svg>':'<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="26" cy="8" r="4" fill="currentColor"/><path d="M22 14c2-2 6-2 8 1l3 6 5 2-2 4-7-3-3-5-1 7 6 5-3 4-7-5-3 9-4-1 4-15 1-8-6 5-3-3 8-9Z" fill="currentColor"/><path d="M9 30c-2 2-3 4-3 7M14 33c-2 2-3 4-3 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".65"/></svg>'}
let securityView=localStorage.getItem('knxSecurityView')||'locks';
function setSecurityView(view){securityView=view;localStorage.setItem('knxSecurityView',view);renderSecurity();}
let securityLockIconId=0;
function securityLockIcon(locked){
 const id='security-lock-'+(++securityLockIconId),shackle='M20 35V23C20 6 46 6 46 23V35',turn=locked?'':'rotate(-35 20 35)';
 const layers=[36,40,44,48,52,56].map(y=>'<path d="M12 '+y+'H53" stroke="#756c32" stroke-opacity=".34" stroke-width="1"/><path d="M12 '+(y+1)+'H53" stroke="#fff4b2" stroke-opacity=".32" stroke-width=".7"/>').join('');
 return '<span class="security-lock-emoji '+(locked?'is-locked':'is-unlocked')+'" aria-hidden="true"><svg viewBox="0 0 64 64" data-lock-state="'+(locked?'locked':'unlocked')+'"><defs><linearGradient id="'+id+'-brass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d6ce80"/><stop offset=".16" stop-color="#e9df9a"/><stop offset=".52" stop-color="#bbb267"/><stop offset=".88" stop-color="#a79c51"/><stop offset="1" stop-color="#877b39"/></linearGradient><linearGradient id="'+id+'-steel" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#7f96aa"/><stop offset=".24" stop-color="#f4fafc"/><stop offset=".52" stop-color="#c3d1db"/><stop offset=".75" stop-color="#f1f6f9"/><stop offset="1" stop-color="#7a90a3"/></linearGradient></defs><ellipse cx="33" cy="60" rx="23" ry="2" fill="#000" opacity=".2"/><g transform="'+turn+'"><path d="'+shackle+'" fill="none" stroke="#566876" stroke-width="8" stroke-linecap="round"/><path d="'+shackle+'" fill="none" stroke="url(#'+id+'-steel)" stroke-width="5.7" stroke-linecap="round"/></g><path d="M11 31H53V59H11Z" fill="url(#'+id+'-brass)" stroke="#8b8144" stroke-width=".6"/><path d="M12 32H52" stroke="#f6edb2" stroke-width="1.3"/>'+layers+'<path d="M12 32V58" stroke="#fff5ba" stroke-opacity=".55" stroke-width="1.4"/><path d="M51 32V58" stroke="#746a30" stroke-opacity=".25" stroke-width="2"/><path d="M12 58H52" stroke="#70662c" stroke-opacity=".65" stroke-width="1"/></svg></span>';
}
function renderSecurity(){
 const locksBox=document.getElementById('securityLocks'), motionBox=document.getElementById('securityMotion'); if(!locksBox||!motionBox)return;
 const rs=rooms(), permittedRooms=new Set(rs);
 const raw=securityDevices(), devices=raw.filter(x=>permittedRooms.has(String(x.room||''))).map(x=>({...x,type:x.type==='security'?(x.securityType==='motion'?'motion':'lock'):x.type}));
 const roomsWith=(type)=>rs.filter(r=>devices.some(x=>x.room===r&&x.type===type));
 const dot=(red)=>'<span class="security-dot '+(red?'red':'')+'"></span>';
 function renderRoomCards(box,type){
   box.innerHTML=''; const uniqueRooms=roomsWith(type);
   if(!uniqueRooms.length){box.innerHTML='<div class="muted" style="padding:10px 0">No '+(type==='lock'?'locks':'motion sensors')+' configured.</div>';return;}
   uniqueRooms.forEach(room=>{
     const items=devices.filter(x=>x.type===type&&(x.room||'No room')===room);
     const card=document.createElement('div');card.className='security-page-room';
     let html='<div class="security-page-room-head"><span class="security-page-room-title">'+esc(room)+'</span><span class="security-page-room-count">'+items.length+' '+(type==='lock'?'lock':'sensor')+(items.length===1?'':'s')+'</span></div>';
     if(type==='lock'){
       html+=items.map(x=>{
         const i=raw.findIndex(z=>z.id===x.id), physical=x.locked!==false, control=x.controlLocked!==undefined?!!x.controlLocked:physical;
         const statusRed=x.statusInvert?!physical:physical?false:true;
         const lockLedRed=x.statusInvert?physical:!physical;
         const unlockLedRed=x.statusInvert?!physical:physical;
         const controlLockRed=x.controlInvert?!control:!control;
         const controlUnlockRed=x.controlInvert?control:!control;
         return '<div class="security-item"><div class="security-icon">'+securityLockIcon(physical)+'</div><div><div class="security-name">'+esc(x.name)+'</div><div class="security-state '+(physical?'locked':'unlocked')+'">'+dot(lockLedRed)+(physical?'Locked':'Unlocked')+'</div></div>'+(x.controllable?'<div class="security-actions"><button class="security-btn lock '+(control?'active':'')+(controlLockRed?' red-led':' green-led')+'" onclick="toggleSecurityLock('+i+',true)">Lock</button><button class="security-btn unlock '+(!control?'active':'')+(controlUnlockRed?' red-led':' green-led')+'" onclick="toggleSecurityLock('+i+',false)">Unlock</button></div>':'')+'</div>';
       }).join('');
     } else {
       html+=items.map(x=>{const i=raw.findIndex(z=>z.id===x.id),motion=x.motion===true,enabled=x.enabled!==false;const motionRed=x.motionInvert?(!motion):motion;const enableRed=x.enableInvert?enabled:!enabled;return '<div class="security-motion-row"><div class="security-motion-icon">'+(motion?motionIconSvg('motion'):motionIconSvg('standby'))+'</div><div><div class="security-motion-name">'+esc(x.name)+'</div><div class="security-motion-status '+(motion?'detected':'standby')+'">'+dot(motionRed)+(motion?'Motion':'Standby')+'</div><div class="security-motion-last">Last detection: '+esc(x.lastTime||'—')+'</div></div>'+(x.controllable?'<div class="security-motion-actions"><button class="security-enable-btn '+(enabled?'enabled':'disabled')+(enableRed?' red-led':' green-led')+'" onclick="toggleMotionEnable('+i+','+(!enabled)+')">'+(enabled?'Enabled':'Disabled')+'</button></div>':'')+'</div>'}).join('');
     }
     card.innerHTML=html;box.appendChild(card);
   });
 }
 renderRoomCards(locksBox,'lock'); renderRoomCards(motionBox,'motion');
 document.querySelectorAll('.security-mode .security-pill').forEach(b=>b.classList.toggle('active',b.dataset.mode===securityState.mode));
 const ms=document.querySelector('.motion-heading-icon');if(ms&&!ms.innerHTML)ms.innerHTML=motionIconSvg('motion');
}
const securityModes=['Home','Night','Away'];
function normalizeSecurityMode(mode){return securityModes.includes(mode)?mode:'Home';}
const securityState={mode:normalizeSecurityMode(localStorage.getItem('knxSecurityMode'))};
function toggleSecurityLock(i,wantLocked){const a=securityDevices(),x=a[i];if(!x||x.controllable===false)return;const ga=String(x.writeGa||'').trim();if(ga&&gaOK(ga))send({type:'knx-write',ga,dpt:'1.001',value:securityKnxValue(x,wantLocked)?1:0});toast(x.name+(wantLocked?' lock command sent':' unlock command sent'));}
function toggleMotionEnable(i,wantEnabled){const a=securityDevices(),x=a[i];if(!x||x.controllable===false)return;const ga=String(x.enableWriteGa||'').trim();if(ga&&gaOK(ga))send({type:'knx-write',ga,dpt:'1.001',value:securityKnxValue(x,wantEnabled)?1:0});toast(x.name+(wantEnabled?' enable command sent':' disable command sent'));}
function setSecurityMode(btn,mode){applySecurityMode(mode);renderOverview();postSharedState();toast('Security mode: '+securityState.mode);}
function applySecurityMode(mode){securityState.mode=normalizeSecurityMode(mode);localStorage.setItem('knxSecurityMode',securityState.mode);document.querySelectorAll('.security-mode .security-pill').forEach(x=>x.classList.toggle('active',x.dataset.mode===securityState.mode));}

function renderConfiguredAv(){
 const box=document.getElementById('avDeviceList'),status=document.getElementById('avDeviceStatus');
 if(!box)return;
 const devices=genericDevices().filter(x=>x.type==='av');
 box.innerHTML='';
 if(status)status.textContent=devices.length+' device'+(devices.length===1?'':'s');
 if(!devices.length){box.innerHTML='<div class="muted" style="padding:20px 4px">No Audio & Video devices configured yet. Add an Audio & Video device in Settings → Devices.</div>';return;}
 const byRoom={};devices.forEach(x=>(byRoom[x.room||'Other']??=[]).push(x));
 Object.entries(byRoom).forEach(([room,list])=>{
   const card=document.createElement('div');card.className='device';
   card.innerHTML='<div class="settings-heading"><div><b>🎬 '+esc(room)+'</b></div><span class="muted">'+list.length+' device'+(list.length===1?'':'s')+'</span></div>'+
     list.map(x=>'<div class="row" style="padding:12px 0"><span><b>'+esc(x.name||'AV device')+'</b><br><small class="muted">Audio & Video'+(x.feedbackGa?' · Status linked':'')+'</small></span><button class="btn" data-av-id="'+esc(x.id)+'">'+(x.active===false?'Turn on':'Active')+'</button></div>').join('');
   card.querySelectorAll('[data-av-id]').forEach(btn=>btn.addEventListener('click',()=>{
     const x=list.find(y=>String(y.id)===btn.dataset.avId); if(!x)return;
     if(x.writeGa&&gaOK(x.writeGa)){const want=x.active===false;send({type:'knx-write',ga:String(x.writeGa).trim(),dpt:'1.001',value:want?1:0});x.active=want;saveGenericDevices(genericDevices().map(y=>y.id===x.id?x:y));renderConfiguredAv();renderOverview();}
     else toast('No control group address configured for '+(x.name||'this device'));
   }));
   box.appendChild(card);
 });
}
function closeCameraFullscreen(){const fs=document.getElementById('cameraFullscreen'),img=document.getElementById('cameraFullscreenStream');if(!fs)return;fs.classList.remove('open');fs.classList.remove('show');if(img)img.src='';}
function renderConfiguredCameras(){
 const grid=document.getElementById('cameraDeviceGrid'),status=document.getElementById('cameraStatus');if(!grid)return;
 const cams=genericDevices().filter(x=>x.type==='camera');grid.innerHTML='';
 if(status)status.textContent=cams.length+' camera'+(cams.length===1?'':'s');
 cams.forEach((x,i)=>{const tile=document.createElement('div');tile.className='camera-tile';tile.tabIndex=0;tile.setAttribute('role','button');const isRtsp=/^rtsps?:\/\//i.test(String(x.url||''));const src=isRtsp?('/camera/configured/'+encodeURIComponent(String(x.id))+'.mjpg?ts='+Date.now()):(x.url||'');tile.innerHTML='<div class="camera-title">'+esc(x.name||'Camera '+(i+1))+' <small class="muted">'+esc(x.room||'')+'</small></div><div class="camera-frame"><img id="configuredCameraStream'+i+'" src="'+esc(src)+'" alt="'+esc(x.name||'Camera '+(i+1))+'"></div><div class="camera-url muted" id="cameraMsg'+i+'">'+(isRtsp?'Connecting to RTSP stream…':'')+'</div>';const img=tile.querySelector('img');img.addEventListener('load',()=>{const m=tile.querySelector('#cameraMsg'+i);if(m)m.textContent='Live'});img.addEventListener('error',async()=>{const m=tile.querySelector('#cameraMsg'+i);if(!m)return;if(isRtsp){m.textContent='Stream unavailable — testing camera…';try{const r=await fetch('/api/camera/'+encodeURIComponent(String(x.id))+'/test',{cache:'no-store'});const j=await r.json();m.textContent=j.ok?'Stream unavailable — retrying…':'Camera connection failed: '+(j.error||'no response');}catch(e){m.textContent='Camera connection test failed';}}else m.textContent='Stream unavailable — click to retry';});tile.addEventListener('click',()=>openConfiguredCameraFullscreen(x));grid.appendChild(tile)});
 if(!cams.length)grid.innerHTML='<div class="muted" style="padding:20px 4px">No cameras configured yet. Add a Camera device in Settings → Devices.</div>';
}
function openConfiguredCameraFullscreen(x){const fs=document.getElementById('cameraFullscreen'),img=document.getElementById('cameraFullscreenStream'),title=document.getElementById('cameraFsTitle');if(!fs||!img)return;title.textContent=x.name||'Camera';img.src=/^rtsps?:\/\//i.test(String(x.url||''))?('/camera/configured/'+encodeURIComponent(String(x.id))+'.mjpg?ts='+Date.now()):(x.url||'');fs.classList.add('open')}
function renderConfiguredScenes(){
 const box=document.getElementById('sceneDeviceList');if(!box)return;const scenes=genericDevices().filter(x=>x.type==='scene');box.innerHTML='';
 if(!scenes.length){box.innerHTML='<div class="muted" style="padding:20px 4px">No scenes configured yet. Add a Scenes device in Settings → Devices.</div>';return}
 const byRoom={};scenes.forEach(x=>(byRoom[x.room||'']??=[]).push(x));Object.entries(byRoom).forEach(([room,list])=>{const card=document.createElement('div');card.className='device';card.innerHTML='<b>'+esc(room)+'</b><div class="actions" style="margin-top:10px">'+list.map(x=>'<button class="btn" data-scene="'+esc(x.id)+'">✨ '+esc(x.name||'Scene')+'</button>').join('')+'</div>';card.querySelectorAll('[data-scene]').forEach(btn=>btn.addEventListener('click',()=>{const x=list.find(y=>String(y.id)===btn.dataset.scene);if(x?.writeGa)send({type:'knx-write',ga:String(x.writeGa).trim(),dpt:'1.001',value:true});toast((x?.name||'Scene')+' activated')}));box.appendChild(card)})

function renderOverview(){
 const secBox=document.getElementById('overviewSecuritySummary');
 const sec=securityDevices().filter(x=>rooms().includes(String(x.room||'')));
 const mode=securityState.mode||'Home';

function thermostatNumber(value,fallback){const number=Number(value);return Number.isFinite(number)?number:fallback}
function thermostatTarget(device){return thermostatNumber(device.setpointValue??device.feedbackValue??device.value,21)}
function thermostatMeasured(device){return thermostatNumber(device.measuredValue,thermostatTarget(device))}
function thermostatModeLabel(value){return ({1:'Comfort',2:'Standby',3:'Economy',4:'Protection'})[Number(value)]||'Comfort'}
function thermostatSend(device,key,fallbackKey,value,fallbackDpt){const ga=String(device[key]||device[fallbackKey]||'').trim();if(ga&&gaOK(ga))send({type:'knx-write',ga,dpt:climateDriverDpt(device,key,fallbackDpt),value})}

updateClimateFeedback=function(ga,value){
 const address=String(ga||'').trim(),devices=genericDevices();let changed=false;
 devices.filter(item=>item.type==='thermostat').forEach(device=>{const driver=climateDriver(device),isSwitch=String(driver&&driver.baseType)==='switch';
  if(isSwitch&&String(device.feedbackGa||'').trim()===address){device.feedbackValue=Number(value)>0?1:0;device.value=device.feedbackValue;changed=true;return}
  if([device.measuredGa,device.feedbackGa].some(item=>String(item||'').trim()===address)){device.measuredValue=Number(value);changed=true}
  if([device.setpointStatusGa].some(item=>String(item||'').trim()===address)){device.setpointValue=Number(value);device.value=device.setpointValue;changed=true}
  if(String(device.modeStatusGa||'').trim()===address){device.modeValue=Number(value);changed=true}
  if(String(device.fanStatusGa||'').trim()===address){device.fanValue=Number(value);changed=true}
 });
 if(!changed)return false;saveGenericDevices(devices,{shared:false});if(currentPageId==='climate')renderClimate();return true;
};

document.querySelectorAll('.nexus-brand').forEach(brand=>brand.addEventListener('pointermove',event=>{const rect=brand.getBoundingClientRect();brand.style.setProperty('--nx',((event.clientX-rect.left)/rect.width*100).toFixed(1)+'%');brand.style.setProperty('--ny',((event.clientY-rect.top)/rect.height*100).toFixed(1)+'%')}));



async function loadPortalUsers(){
  try{
    const r=await fetch('/api/portal/users',{headers:settingsRequestHeaders(),cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json(),box=document.getElementById('portalUserList'),count=document.getElementById('portalUserCount');
    if(count)count.textContent=(j.users||[]).length+' users';
    if(box){
      box.innerHTML=(j.users||[]).map(u=>'<div class="card" style="padding:12px"><div class="settings-heading" style="margin:0"><div><b>'+esc(u.email)+'</b><div class="muted">'+esc(u.role)+(u.disabled?' · disabled':'')+'</div></div><button type="button" class="btn" data-portal-delete="'+encodeURIComponent(u.email)+'">Delete</button></div></div>').join('')||'<div class="muted">No users.</div>';
      box.querySelectorAll('[data-portal-delete]').forEach(btn=>btn.addEventListener('click',()=>deletePortalUser(btn.dataset.portalDelete)));
    }
  }catch(_){}
}
async function createPortalUser(){const email=document.getElementById('portalNewEmail')?.value||'',password=document.getElementById('portalNewPassword')?.value||'',role=document.getElementById('portalNewRole')?.value||'user';try{const r=await fetch('/api/portal/users',{method:'POST',headers:settingsRequestHeaders({'Content-Type':'application/json'}),body:JSON.stringify({email,password,role})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Could not create user');document.getElementById('portalNewPassword').value='';document.getElementById('portalNewEmail').value='';toast('Portal user created');loadPortalUsers();}catch(e){toast(e.message)}}
async function deletePortalUser(encoded){if(!confirm('Delete this portal user?'))return;try{const r=await fetch('/api/portal/users/'+encoded,{method:'DELETE',headers:settingsRequestHeaders()}),j=await r.json();if(!r.ok)throw new Error(j.error||'Could not delete user');toast('Portal user deleted');loadPortalUsers();}catch(e){toast(e.message)}}
let nuvexCloudTimer;
function renderNuvexCloud(j,updateInputs=false){
 const checkbox=document.getElementById('nuvexCloudEnabled'),url=document.getElementById('nuvexCloudUrl');
 checkbox.checked=!!j.enabled;
 if(updateInputs)url.value=j.url||'https://cloud.nuvexai.nl';
 document.getElementById('nuvexCloudStatus').textContent=j.remoteAccessEnabled?'Op afstand beschikbaar':j.online?'Geregistreerd':j.enabled?'Verbinding maken':'Uitgeschakeld';
 document.getElementById('nuvexCloudResult').textContent=j.warning||j.error||(j.remoteAccessEnabled?'Dit systeem is beschikbaar via het Nuvex-cloudportaal.':j.enabled?'Accounts worden gesynchroniseerd. De remote verbinding wordt voorbereid.':'Cloud Access is uitgeschakeld. Er worden geen accounts verstuurd.');
}
async function loadNuvexCloud(updateInputs=true){try{
 const r=await fetch('/api/portal/nuvex-cloud/status',{headers:settingsRequestHeaders(),cache:'no-store'});
 if(!r.ok)return;renderNuvexCloud(await r.json(),updateInputs);
 clearTimeout(nuvexCloudTimer);nuvexCloudTimer=setTimeout(()=>loadNuvexCloud(false),10000);
}catch(_){}}
async function saveNuvexCloud(){
 const checkbox=document.getElementById('nuvexCloudEnabled'),url=document.getElementById('nuvexCloudUrl');checkbox.disabled=true;clearTimeout(nuvexCloudTimer);
 try{const r=await fetch('/api/portal/nuvex-cloud/set-enabled',{method:'POST',headers:settingsRequestHeaders({'Content-Type':'application/json'}),body:JSON.stringify({enabled:checkbox.checked,url:url.value.trim()})});const j=await r.json();if(!r.ok)throw Error(j.error||'Cloudinstellingen opslaan mislukt.');renderNuvexCloud(j,true);toast(j.enabled?'Cloud Access ingeschakeld':'Cloud Access uitgeschakeld');}
 catch(e){await loadNuvexCloud(false);document.getElementById('nuvexCloudResult').textContent=e.message;toast(e.message);}
 finally{checkbox.disabled=false;nuvexCloudTimer=setTimeout(()=>loadNuvexCloud(false),10000);}
}

<script id="nuvexAi30LookFeelScript">
function applyNuvexLookFeel(value){
  const mode=value==='normal'?'normal':'default';
  document.body.classList.toggle('nuvex-look-default',mode==='default');
  document.body.classList.toggle('nuvex-look-normal',mode==='normal');
  const select=document.getElementById('nuvexLookFeel'); if(select)select.value=mode;
}
function setNuvexLookFeel(value){
  const mode=value==='normal'?'normal':'default';
  localStorage.setItem('nuvexAi30LookFeel',mode); applyNuvexLookFeel(mode);
}
document.addEventListener('DOMContentLoaded',()=>applyNuvexLookFeel(localStorage.getItem('nuvexAi30LookFeel')||'default'));
new MutationObserver(()=>{const s=document.getElementById('nuvexLookFeel');if(s)applyNuvexLookFeel(localStorage.getItem('nuvexAi30LookFeel')||'default')}).observe(document.documentElement,{childList:true,subtree:true});
</script>
<script id="uiBackgroundManagerScript">
let uiBackgroundSelected='builtin-city';
function bgEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function applyUiBackground(id){
  uiBackgroundSelected=id||'builtin-city';
  const layer=document.getElementById('nuvexUiBackground');
  if(layer) layer.style.backgroundImage="url('/ui-background/"+encodeURIComponent(uiBackgroundSelected)+"')";
}
async function loadUiBackgrounds(){
  try{
    const r=await fetch('/api/ui-backgrounds',{cache:'no-store'}),j=await r.json();
    if(!r.ok)throw Error(j.error||'Could not load backgrounds');
    applyUiBackground(j.selected);
    const grid=document.getElementById('uiBackgroundGrid'); if(!grid)return;
    grid.innerHTML=j.items.map(x=>{
      const id=encodeURIComponent(x.id), active=x.id===j.selected;
      return '<div class="ui-bg-item '+(active?'active':'')+'"><div class="ui-bg-preview" style="background-image:url(\''+x.url+'\')"></div><div class="ui-bg-info"><div class="ui-bg-name">'+bgEsc(x.name)+'</div><div class="ui-bg-actions"><button class="btn" type="button" data-bg-use="'+id+'">'+(active?'Selected':'Use')+'</button>'+(x.builtin?'':'<button class="btn danger" type="button" data-bg-delete="'+id+'">Delete</button>')+'</div></div></div>';
    }).join('');
  }catch(e){const g=document.getElementById('uiBackgroundGrid');if(g)g.innerHTML='<div class="muted">'+bgEsc(e.message)+'</div>';}
}
async function selectUiBackground(id){
  const r=await fetch('/api/ui-backgrounds/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}),j=await r.json().catch(()=>({}));
  if(!r.ok){alert(j.error||'Could not select background');return} await loadUiBackgrounds();
}
async function deleteUiBackground(id){
  if(!confirm('Delete this uploaded background?'))return;
  const r=await fetch('/api/ui-backgrounds/'+encodeURIComponent(id),{method:'DELETE'}),j=await r.json().catch(()=>({}));
  if(!r.ok){alert(j.error||'Delete failed');return} await loadUiBackgrounds();
}
function uploadUiBackground(input){
  const file=input.files&&input.files[0];if(!file)return;
  if(file.size>12*1024*1024){alert('Image must be 12 MB or smaller.');input.value='';return}
  const rd=new FileReader();rd.onload=async()=>{
    const r=await fetch('/api/ui-backgrounds/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name.replace(/\.[^.]+$/,''),dataUrl:rd.result})}),j=await r.json().catch(()=>({}));
    input.value='';if(!r.ok){alert(j.error||'Upload failed');return}await loadUiBackgrounds();
  };rd.readAsDataURL(file);
}
document.addEventListener('click',e=>{
  const use=e.target.closest('[data-bg-use]');if(use){selectUiBackground(decodeURIComponent(use.dataset.bgUse));return}
  const del=e.target.closest('[data-bg-delete]');if(del){deleteUiBackground(decodeURIComponent(del.dataset.bgDelete));}
});
document.addEventListener('DOMContentLoaded',()=>loadUiBackgrounds());
new MutationObserver(()=>{if(document.getElementById('uiBackgroundGrid')&&!document.querySelector('#uiBackgroundGrid .ui-bg-item'))loadUiBackgrounds();}).observe(document.body,{childList:true,subtree:true});
</script>
