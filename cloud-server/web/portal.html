<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuvex AI · Cloud Access</title><link rel="stylesheet" href="/_portal/style.css"><script defer src="/_portal/app.js"></script></head><body><div class="media"></div><div class="shade"></div><main class="stage"><img class="mobile-auth-logo" src="/_portal/logo.png" alt="NUVEX AI"><section class="card"><h1 id="title">Welkom terug</h1><p class="sub" id="subtitle">Log in op jouw Nuvex-systeem</p><form id="login"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="username" required autofocus><label for="password">Wachtwoord</label><div class="field"><input id="password" type="password" autocomplete="current-password" required><button class="eye" id="eye" type="button" aria-label="Wachtwoord tonen">◉</button></div><button id="submit" class="primary">Inloggen →</button><p class="system-hint">Zijn meerdere systemen gekoppeld, dan kies je na het inloggen welk systeem je opent.</p></form><section id="choices" hidden><div id="systems"></div><button id="logout" type="button" class="secondary">Uitloggen</button></section><div id="error" class="error" role="status"></div><a class="admin-link" href="/admin">Inloggen als beheerder</a></section></main></body></html>
