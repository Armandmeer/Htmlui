</style></head><body><div class="media" id="media"><video id="bgVideo" autoplay muted loop playsinline poster="/login-media/startup-fullscreen.png?v=2120"><source src="/login-media/background.mp4" type="video/mp4"></video></div><div class="shade"></div><main class="stage"><img class="mobile-auth-logo" src="/nuvex-ai-sidebar-logo.png?v=2160" alt="NUVEX AI"><section class="card"><h1>First setup</h1><p class="sub">Create the first administrator account</p><form id="f"><label>Email address</label><input id="email" type="email" autocomplete="username" required autofocus><label>Password</label><div class="field"><input id="password" type="password" autocomplete="new-password" minlength="8" required><button class="eye" id="eye" type="button">◉</button></div><label>Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="submit" class="primary" type="submit">Create account →</button><div id="error" class="error"></div></form></section></main><script>async function initMedia(){try{const r=await fetch('/login-media/status',{cache:'no-store'}),j=await r.json();if(j.video){const v=document.getElementById('bgVideo');v.style.display='block';v.play().catch(()=>{});}}catch(e){}}initMedia();
(async()=>{try{const r=await fetch('/api/auth/setup-status',{cache:'no-store'}),j=await r.json();if(!j.needsSetup)location.replace('/login.html');}catch(e){}})();
